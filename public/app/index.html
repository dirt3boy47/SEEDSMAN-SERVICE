<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Seedsman">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Seedsman Quote</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/app/css/app.css">
<script>try { var t = localStorage.getItem('seedsman-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
<aside id="side" class="panel" aria-label="Main menu"></aside>
<div id="scrim" hidden></div>
<main id="main">
  <header id="top" class="panel"></header>
  <div id="view"></div>
</main>
<div id="toasts" aria-live="polite"></div>
<div id="modal-wrap" hidden><div id="modal" class="panel" role="dialog" aria-modal="true"></div></div>

<script src="/vendor/leaflet.js"></script>
<script src="/app/js/pricing.js"></script>
<script src="/app/js/geo.js"></script>
<script src="/app/js/core.js"></script>
<script src="/app/js/gis.js"></script>
<script src="/app/js/doc.js"></script>
<script src="/app/js/views-overview.js"></script>
<script src="/app/js/views-quotes.js"></script>
<script src="/app/js/views-pipeline.js"></script>
<script src="/app/js/views-records.js"></script>
<script src="/app/js/views-map.js"></script>
<script src="/app/js/views-schedule.js"></script>
<script src="/app/js/views-jobs.js"></script>
<script src="/app/js/views-settings.js"></script>
<script>App.start();</script>
</body>
</html>
