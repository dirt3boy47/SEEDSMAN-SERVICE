<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a5f">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<title>Get a quote · Seedsman's Hedges</title>
<meta name="description" content="Hedge trimming, lawns and garden care on the Mornington Peninsula. Ask for a free quote.">
<link rel="stylesheet" href="/app/css/app.css">
<style>
  body { padding: calc(14px + var(--safe-t)) 12px calc(30px + var(--safe-b)); }
  .enq { max-width: 560px; margin: 0 auto; padding: 22px 20px; }
  .enq-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
  .enq-head b { display: block; font-size: 18px; }
  .enq-head small { color: var(--muted); }
  .enq h1 { font-size: 24px; margin: 6px 0 4px; letter-spacing: -.01em; }
  .enq .sub { color: var(--muted); margin: 0 0 16px; }
  .enq .field { margin-top: 12px; }
  .enq input, .enq textarea { font-size: 16px !important; }
  .enq .chips { margin-top: 6px; }
  .enq .send { width: 100%; justify-content: center; min-height: 52px; font-size: 16px; margin-top: 18px; }
  .enq .done { text-align: center; padding: 30px 6px; }
  .enq .done .tick { width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
  .enq .done .tick svg { width: 42px; height: 42px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<main class="enq panel" id="box">
  <div class="enq-head"><span class="brand-mark"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14zM5 19 13 11"/></svg></span><div><b>Seedsman’s Hedges</b><small>Mornington Peninsula</small></div></div>
  <h1>Ask for a free quote</h1>
  <p class="sub">Tell us a little about the job and we’ll be in touch — usually the same day.</p>
  <form id="f" novalidate>
    <label class="field">Your name<input name="name" autocomplete="name" required></label>
    <label class="field">Phone<input name="phone" type="tel" inputmode="tel" autocomplete="tel"></label>
    <label class="field">Email<input name="email" type="email" autocomplete="email"></label>
    <label class="field">Street address<input name="address" autocomplete="street-address"></label>
    <label class="field">Suburb<input name="suburb" autocomplete="address-level2"></label>
    <div class="field">What do you need?</div>
    <div class="chips" id="svc"></div>
    <label class="field">Anything else?<textarea name="message" rows="4" placeholder="e.g. 20 m of tall cypress along the front fence"></textarea></label>
    <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
    <button class="btn primary send" type="submit" id="go">Send my enquiry</button>
    <p class="muted small" id="err" style="color:var(--danger)"></p>
  </form>
</main>
<script>
(function () {
  var SVC = ['Hedge trimming', 'Lawn mowing', 'Garden tidy', 'Tree & shrub pruning', 'Green waste removal', 'Other'], picked = [];
  var box = document.getElementById('svc');
  box.innerHTML = SVC.map(function (s) { return '<button type="button" class="chipb" data-s="' + s + '">' + s + '</button>'; }).join('');
  box.onclick = function (e) { var b = e.target.closest('[data-s]'); if (!b) return; b.classList.toggle('on'); var s = b.getAttribute('data-s'), i = picked.indexOf(s); if (i >= 0) picked.splice(i, 1); else picked.push(s); };
  document.getElementById('f').onsubmit = function (e) {
    e.preventDefault();
    var f = e.target, v = function (n) { return f.elements[n].value.trim(); }, err = document.getElementById('err'), go = document.getElementById('go');
    if (!v('name')) { err.textContent = 'Please add your name.'; return; }
    if (!v('phone') && !v('email')) { err.textContent = 'Please add a phone number or email so we can reply.'; return; }
    err.textContent = ''; go.disabled = true; go.textContent = 'Sending…';
    fetch('/api/public/enquiry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: v('name'), phone: v('phone'), email: v('email'), address: v('address'), suburb: v('suburb'), message: v('message'), services: picked, website: v('website') }) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Something went wrong — please call us.'); }); })
      .then(function () {
        document.getElementById('box').innerHTML = '<div class="done"><div class="tick"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></div><h1>Thanks, ' + v('name').split(' ')[0].replace(/[<>&"]/g, '') + '!</h1><p class="sub">We’ve got your enquiry and will be in touch soon.</p></div>';
      })
      .catch(function (x) { err.textContent = x.message; go.disabled = false; go.textContent = 'Send my enquiry'; });
  };
})();
</script>
</body>
</html>
