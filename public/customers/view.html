<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer · Seedsman</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="top" id="top"></header>
<main class="page">
  <p><a href="/customers/">‹ Customers</a></p>
  <div class="page-head"><h1 id="c-title">Customer</h1><button class="btn primary" type="button" id="new-quote">+ New quote</button></div>

  <div class="cols">
    <section class="card">
      <h2>Details</h2>
      <form class="fields two" id="details" autocomplete="off">
        <label>Name<input type="text" id="c-name" required></label>
        <label>Phone<input type="tel" id="c-phone"></label>
        <label>Email<input type="email" id="c-email"></label>
        <label>How they found us<select id="c-source"><option>Phone</option><option>Website</option><option>Referral</option><option>Repeat customer</option><option>Walk-in</option><option>Other</option></select></label>
        <label class="wide">Notes<textarea id="c-notes" rows="3"></textarea></label>
        <div class="row wide"><button class="btn" type="submit">Save details</button><button class="link danger" type="button" id="c-delete">Delete customer</button></div>
      </form>
    </section>

    <section class="card">
      <div class="page-head small"><h2>Quotes</h2></div>
      <div id="quotes"></div>
    </section>
  </div>

  <section class="card">
    <div class="page-head small">
      <h2>Property</h2>
      <span class="row"><select id="prop-select" hidden></select><button class="btn small" type="button" id="prop-add">+ Add property</button></span>
    </div>
    <div id="prop-none" class="hint" hidden>No property yet. Tap <b>+ Add property</b>.</div>
    <div id="prop-box">
      <form class="fields three" id="prop-form" autocomplete="off">
        <label class="wide2">Address<input type="text" id="p-address"></label>
        <label>Suburb<input type="text" id="p-suburb"></label>
        <label class="wide2">Access / gate code<input type="text" id="p-access"></label>
        <label>Hazards<input type="text" id="p-hazards" placeholder="dog, power lines…"></label>
        <div class="row wide3"><button class="btn" type="submit">Save property</button><button class="btn" type="button" id="p-find">Find address on map</button><button class="btn" type="button" id="p-pin">Pin house at map centre</button></div>
      </form>
      <div class="mini-map-wrap"><div id="map" class="mini-map"></div><select id="basemap" class="map-select" aria-label="Map imagery"></select></div>
      <h3>Measured hedges</h3>
      <div id="hedges"></div>
      <p class="hint" id="hedge-total"></p>
    </div>
  </section>
</main>
<script src="/vendor/leaflet.js"></script>
<script src="/js/app.js"></script>
<script src="/js/rates.js"></script>
<script src="/js/map.js"></script>
<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); }, esc = App.esc, R = window.SeedsmanRates;
    App.header('customers');
    var id = App.params().id, data = null, prop = null, rates = R.normalise(null);
    var map = SeedMap.create('map', { select: $('basemap') }), layer = L.layerGroup().addTo(map), pin = null;

    function toLatLngs(g) { var c = g.type === 'Polygon' ? g.coordinates[0].slice(0, -1) : g.coordinates; return c.map(function (p) { return L.latLng(p[1], p[0]); }); }
    function setPin(ll) {
      if (pin) { map.removeLayer(pin); pin = null; }
      if (!ll) return;
      pin = L.marker(ll, { draggable: true, keyboard: false, title: 'House (drag to move, then Save property)',
        icon: L.divIcon({ className: 'house-pin', iconSize: [30, 30], iconAnchor: [15, 28], html: '<span>⌂</span>' }) }).addTo(map);
    }
    function load() {
      return App.get('customers/' + encodeURIComponent(id)).then(function (d) {
        data = d; var c = d.customer;
        document.title = c.name + ' · Seedsman'; $('c-title').textContent = c.name;
        $('c-name').value = c.name; $('c-phone').value = c.phone; $('c-email').value = c.email; $('c-source').value = c.source; $('c-notes').value = c.notes;
        var sel = $('prop-select');
        sel.innerHTML = d.properties.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc([p.address, p.suburb].filter(Boolean).join(', ') || 'Property') + '</option>'; }).join('');
        sel.hidden = d.properties.length < 2;
        showProperty(prop && d.properties.filter(function (p) { return p.id === prop.id; })[0] || d.properties[0] || null);
        renderQuotes();
      }).catch(function (e) { App.toast(e.message); });
    }
    function renderQuotes() {
      var q = data.quotes;
      $('quotes').innerHTML = q.length ? '<div class="q-list">' + q.map(function (x) {
        var p = data.properties.filter(function (y) { return y.id === x.property_id; })[0];
        return '<a class="cust-row" href="/quote/hedge.html?quote=' + encodeURIComponent(x.id) + '"><div><b>' + esc(x.number) + '</b> <span class="badge s-' + esc(x.status.toLowerCase()) + '">' + esc(x.status) + '</span>' +
          '<small>' + App.date(x.created_at) + (x.revision > 1 ? ' · rev ' + x.revision : '') + (p && data.properties.length > 1 ? ' · ' + esc(p.address) : '') + ' · ' + App.m2(x.area) + '</small></div><div class="right"><b>' + App.money(x.total) + '</b><small>incl. GST</small></div></a>';
      }).join('') + '</div>' : '<p class="hint">No quotes yet.</p>';
    }
    function showProperty(p) {
      prop = p; layer.clearLayers(); setPin(null);
      $('prop-none').hidden = !!p; $('prop-box').hidden = !p;
      if (!p) return;
      $('prop-select').value = p.id;
      $('p-address').value = p.address; $('p-suburb').value = p.suburb; $('p-access').value = p.access; $('p-hazards').value = p.hazards;
      if (p.lat != null) setPin(L.latLng(p.lat, p.lng));
      var total = 0, bounds = L.latLngBounds([]);
      $('hedges').innerHTML = p.hedges.length ? '<table class="tbl"><thead><tr><th>Hedge</th><th>L × H × D (m)</th><th>Cut</th><th>m²</th><th>Measured</th></tr></thead><tbody>' + p.hedges.map(function (h) {
        var i = h.inputs || {}, c = R.hedgeCalc(rates, i); total += c.area;
        var faces = R.FACES.filter(function (f) { return i.faces && i.faces[f.id]; }).map(function (f) { return f.label.replace(' end', ''); }).join(', ');
        if (h.geometry) {
          var lls = toLatLngs(h.geometry), poly = h.geometry.type === 'Polygon';
          layer.addLayer((poly ? L.polygon : L.polyline)(lls, { color: '#3ddc84', weight: 5, fillOpacity: 0.25 }));
          layer.addLayer(L.marker(poly ? L.polygon(lls).getBounds().getCenter() : lls[Math.floor((lls.length - 1) / 2)], { interactive: false, keyboard: false,
            icon: L.divIcon({ className: 'ms-label hl', iconSize: null, html: '<span>' + esc(h.name) + '</span>' }) }));
          lls.forEach(function (ll) { bounds.extend(ll); });
        }
        return '<tr><td>' + esc(h.name) + '</td><td>' + [i.length, i.height, i.depth].map(function (n) { return (+n || 0).toFixed(1); }).join(' × ') + '</td><td>' + esc(faces || '—') + '</td><td>' + c.area.toFixed(1) + '</td><td>' + App.date(h.measuredAt) + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p class="hint">No hedges measured here yet. Tap <b>+ New quote</b> to measure them.</p>';
      $('hedge-total').textContent = p.hedges.length ? 'Total hedge face: ' + App.m2(total) + ' (with the faces chosen last time).' : '';
      if (pin) bounds.extend(pin.getLatLng());
      if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 20 });
      else if (p.address) findAddress(true);
    }
    function findAddress(quiet) {
      var q = [$('p-address').value, $('p-suburb').value].filter(Boolean).join(', ');
      if (!q) { if (!quiet) App.toast('Type the address first.'); return; }
      SeedMap.search(q, map).then(function (list) {
        if (!list.length) { if (!quiet) App.toast('Address not found. Move the map there and tap Pin house at map centre.'); return; }
        map.setView([list[0].lat, list[0].lng], 19); setPin(L.latLng(list[0].lat, list[0].lng));
        App.toast('Found it. Check the pin is on the house, then Save property.');
      }).catch(function () { if (!quiet) App.toast('Address search is not available right now.'); });
    }

    $('details').onsubmit = function (e) {
      e.preventDefault();
      App.put('customers/' + encodeURIComponent(id), { name: $('c-name').value, phone: $('c-phone').value, email: $('c-email').value, source: $('c-source').value, notes: $('c-notes').value })
        .then(function () { App.toast('Details saved.'); $('c-title').textContent = $('c-name').value; }).catch(function (x) { App.toast(x.message); });
    };
    $('c-delete').onclick = function () {
      if (!confirm('Delete ' + $('c-name').value + '? Their quotes are kept but the customer disappears from the list.')) return;
      App.del('customers/' + encodeURIComponent(id)).then(function () { location.href = '/customers/'; }).catch(function (x) { App.toast(x.message); });
    };
    $('prop-select').onchange = function () { showProperty(data.properties.filter(function (p) { return p.id === $('prop-select').value; })[0]); };
    $('prop-add').onclick = function () {
      var address = prompt('Address of the new property:'); if (!address) return;
      App.post('properties', { customer_id: id, address: address }).then(function (d) { prop = { id: d.id }; return load(); }).catch(function (x) { App.toast(x.message); });
    };
    $('p-find').onclick = function () { findAddress(false); };
    $('p-pin').onclick = function () { setPin(map.getCenter()); App.toast('Pin placed. Drag it onto the house, then Save property.'); };
    $('prop-form').onsubmit = function (e) {
      e.preventDefault(); if (!prop) return;
      var ll = pin ? pin.getLatLng() : null;
      App.put('properties/' + encodeURIComponent(prop.id), { address: $('p-address').value, suburb: $('p-suburb').value, access: $('p-access').value, hazards: $('p-hazards').value,
        lat: ll ? ll.lat : null, lng: ll ? ll.lng : null, zoom: map.getZoom() }).then(function () { App.toast('Property saved.'); return load(); }).catch(function (x) { App.toast(x.message); });
    };
    $('new-quote').onclick = function () {
      location.href = '/quote/hedge.html?' + (prop ? 'property=' + encodeURIComponent(prop.id) : 'customer=' + encodeURIComponent(id));
    };
    App.me().then(function (d) { rates = d.rates; return load(); });
  })();
</script>
</body>
</html>
