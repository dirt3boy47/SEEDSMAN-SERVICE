<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customers · Seedsman</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="top" id="top"></header>
<main class="page">
  <div class="page-head">
    <h1>Customers</h1>
    <button class="btn primary" type="button" id="add">+ Add customer</button>
  </div>

  <form class="card fields two" id="new" hidden autocomplete="off">
    <h2 class="wide">New customer</h2>
    <label>Name<input type="text" id="n-name" required></label>
    <label>Phone<input type="tel" id="n-phone"></label>
    <label>Email<input type="email" id="n-email"></label>
    <label>How they found us<select id="n-source"><option>Phone</option><option>Website</option><option>Referral</option><option>Repeat customer</option><option>Walk-in</option><option>Other</option></select></label>
    <label class="wide">Property address<input type="text" id="n-address" placeholder="e.g. 12 Main St"></label>
    <label>Suburb<input type="text" id="n-suburb"></label>
    <label>Access / gate code<input type="text" id="n-access"></label>
    <label class="wide">Notes<textarea id="n-notes" rows="2"></textarea></label>
    <div class="row wide"><button class="btn primary" type="submit">Save customer</button><button class="btn" type="button" id="n-cancel">Cancel</button></div>
    <p class="hint wide">You can pin the house on the map and measure hedges once the customer is saved.</p>
  </form>

  <input type="search" id="q" class="search" placeholder="Search name, phone, email or address">
  <div id="list" class="cust-list"><p class="hint">Loading…</p></div>
</main>
<script src="/js/app.js"></script>
<script>
  (function () {
    var $ = function (id) { return document.getElementById(id); }, esc = App.esc;
    App.header('customers');
    App.me();
    var t;
    function load() {
      App.get('customers?q=' + encodeURIComponent($('q').value.trim())).then(function (d) {
        $('list').innerHTML = d.customers.length ? d.customers.map(function (c) {
          return '<a class="cust-row" href="/customers/view.html?id=' + encodeURIComponent(c.id) + '"><div><b>' + esc(c.name) + '</b><small>' + esc([c.address, c.phone, c.email].filter(Boolean).join(' · ')) + '</small></div>' +
            '<div class="right"><b>' + (c.last_total != null ? App.money(c.last_total) : '') + '</b><small>' + c.quotes + (c.quotes === 1 ? ' quote' : ' quotes') + '</small></div></a>';
        }).join('') : '<p class="hint">' + ($('q').value ? 'No customer matches.' : 'No customers yet. Tap <b>+ Add customer</b>, or save a quote and the customer is added for you.') + '</p>';
      }).catch(function (e) { App.toast(e.message); });
    }
    $('q').addEventListener('input', function () { clearTimeout(t); t = setTimeout(load, 250); });
    $('add').onclick = function () { $('new').hidden = false; $('n-name').focus(); };
    $('n-cancel').onclick = function () { $('new').hidden = true; };
    $('new').onsubmit = function (e) {
      e.preventDefault();
      var v = function (id) { return $(id).value; };
      App.post('customers', { name: v('n-name'), phone: v('n-phone'), email: v('n-email'), source: v('n-source'), notes: v('n-notes'),
        property: v('n-address') ? { address: v('n-address'), suburb: v('n-suburb'), access: v('n-access') } : null })
        .then(function (d) { location.href = '/customers/view.html?id=' + encodeURIComponent(d.id); })
        .catch(function (x) { App.toast(x.message); });
    };
    load();
  })();
</script>
</body>
</html>
