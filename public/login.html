<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Seedsman">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Sign In · Seedsman Quote</title>
<link rel="stylesheet" href="/app/css/app.css">
<script>try { var t = localStorage.getItem('seedsman-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
<div class="auth">
  <form class="panel" id="login">
    <div class="brand" style="padding:0"><span class="brand-mark"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z"/><path d="M5 19l8-8"/></svg></span><span><b>Seedsman Quote</b><small>A GeoCanvas companion</small></span></div>
    <h1>Sign in</h1>
    <p>Quoting, customers and jobs for your crew.</p>
    <div class="stack">
      <label class="field">Email<input type="email" id="email" autocomplete="username" required></label>
      <label class="field">Password<input type="password" id="password" autocomplete="current-password" required></label>
      <p class="err" id="err" hidden></p>
      <button class="btn primary block" type="submit" id="go">Sign in</button>
    </div>
  </form>
</div>
<script>
  (function () {
    var m = /[?&]next=([^&]+)/.exec(location.search), next = m ? decodeURIComponent(m[1]) : '/app/';
    if (!/^\/[^/]/.test(next) || /^\/login/.test(next)) next = '/app/';
    document.getElementById('login').onsubmit = function (e) {
      e.preventDefault();
      var err = document.getElementById('err'), go = document.getElementById('go');
      err.hidden = true; go.disabled = true;
      fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) })
        .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Sign-in failed.'); return d; }); })
        .then(function (d) { try { localStorage.setItem('seedsman-session', d.token); } catch (x) {} location.href = next; })
        .catch(function (x) { err.textContent = x.message; err.hidden = false; go.disabled = false; });
    };
  })();
</script>
</body>
</html>
