<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hedge Quote · Seedsman</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="quote-page">
<header class="top" id="top"></header>

<main class="hq">
  <section class="map-wrap">
    <div id="map"></div>
    <form class="map-bar" id="search-form" autocomplete="off">
      <input type="search" id="search-q" placeholder="Find the address">
      <button class="btn" type="submit">Find</button>
      <button class="btn icon" type="button" id="locate" title="Go to my location" aria-label="Go to my location">◎</button>
      <select id="basemap" aria-label="Map imagery"></select>
    </form>
    <div class="search-results" id="search-results" hidden></div>

    <div class="ms-bar" id="ms-bar" hidden>
      <div class="ms-top">
        <div class="seg" id="ms-mode"><button type="button" data-m="line" class="on">Line</button><button type="button" data-m="area">Area</button></div>
        <label class="check"><input type="checkbox" id="ms-free"> Freehand (trace curves)</label>
      </div>
      <div class="ms-out" id="ms-out"></div>
      <p class="ms-hint" id="ms-hint"></p>
      <div class="draw-btns">
        <button class="btn" type="button" id="ms-undo">Undo</button>
        <button class="btn" type="button" id="ms-clear">Clear</button>
        <button class="btn" type="button" id="ms-cancel">Cancel</button>
        <button class="btn primary" type="button" id="ms-done">Done</button>
      </div>
    </div>
  </section>

  <aside class="panel">
    <section>
      <div class="quote-head">
        <h1 id="q-title">New quote</h1>
        <select id="q-status" aria-label="Quote status" hidden>
          <option>Draft</option><option>Sent</option><option>Accepted</option><option>Declined</option>
        </select>
      </div>
      <p class="hint" id="q-sub"></p>
    </section>

    <section>
      <h2>Customer & property</h2>
      <div id="cust-linked" class="linked" hidden></div>
      <div id="cust-pick">
        <label>Existing customer<input type="search" id="cust-q" placeholder="Search name, phone or address" autocomplete="off"></label>
        <div class="list" id="cust-results" hidden></div>
        <p class="hint">…or a new customer:</p>
      </div>
      <div class="fields two" id="cust-fields">
        <label>Name<input type="text" id="c-name" autocomplete="off"></label>
        <label>Phone<input type="tel" id="c-phone" autocomplete="off"></label>
        <label class="wide">Email<input type="email" id="c-email" autocomplete="off"></label>
      </div>
      <div class="fields two">
        <label class="wide">Property address<input type="text" id="p-address" autocomplete="off"></label>
        <label>Suburb<input type="text" id="p-suburb" autocomplete="off"></label>
        <label>House pin<button class="btn small full" type="button" id="p-pin">Put pin at map centre</button></label>
      </div>
    </section>

    <section>
      <h2>Hedges</h2>
      <p class="hint" id="no-hedges">Find the property, tap <b>Measure a hedge</b>, then tap or trace along it on the map. Use <b>Area</b> to outline a hedge from above.</p>
      <div id="hedges"></div>
      <div class="row">
        <button class="btn primary" type="button" id="add-hedge">+ Measure a hedge</button>
        <button class="btn" type="button" id="add-typed">+ Type sizes</button>
      </div>
    </section>

    <section>
      <h2>Job</h2>
      <div class="fields two">
        <label class="check wide"><input type="checkbox" id="o-waste" checked> Take the green waste away</label>
        <label>Travel, return (km)<input type="number" id="o-km" min="0" step="1" inputmode="numeric" value="0"></label>
        <label class="wide">Notes on the quote<textarea id="q-notes" rows="2"></textarea></label>
      </div>
    </section>

    <section>
      <h2>Price</h2>
      <div id="totals" class="totals"></div>
      <p class="hint" id="rate-note"></p>
    </section>

    <section class="row actions">
      <button class="btn primary" type="button" id="save-quote">Save quote</button>
      <button class="btn" type="button" id="copy-quote">Copy</button>
      <button class="btn" type="button" id="email-quote">Email</button>
      <button class="btn" type="button" id="print-quote">Print</button>
    </section>
    <pre class="print-out" id="print-out"></pre>
  </aside>
</main>

<script src="/vendor/leaflet.js"></script>
<script src="/js/app.js"></script>
<script src="/js/rates.js"></script>
<script src="/js/geo.js"></script>
<script src="/js/map.js"></script>
<script src="/js/measure.js"></script>
<script src="/js/hedge-quote.js"></script>
</body>
</html>
